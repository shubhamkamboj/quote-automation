name: Daily Hindi Quote

on:
  schedule:
    - cron: "0 6,14,19 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-instagram-publishing
  cancel-in-progress: false

jobs:
  publish:
    # Repository variable STOP_WORKFLOW=true disables publishing.
    if: ${{ vars.STOP_WORKFLOW != 'true' }}
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      USE_GEMINI_IMAGE: ${{ vars.USE_GEMINI_IMAGE }}

      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

      META_API_VERSION: ${{ vars.META_API_VERSION }}

      HASHTAGS: ${{ vars.HASHTAGS }}
      AUTO_HASHTAGS: ${{ vars.AUTO_HASHTAGS }}

      ENABLE_IMAGE_POSTS: ${{ vars.ENABLE_IMAGE_POSTS }}
      IMAGE_POST_COUNT: ${{ vars.IMAGE_POST_COUNT }}
      REEL_POST_COUNT: ${{ vars.REEL_POST_COUNT }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required tools
        run: |
          python --version
          ffmpeg -version
          test -f app/create_reel.py
          test -f app/publish_reel.py
          test -f app/image_source.py

      - name: Publish configured image + reel posts
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_ENABLED="${ENABLE_IMAGE_POSTS:-true}"
          IMAGE_COUNT="${IMAGE_POST_COUNT:-4}"
          REEL_COUNT="${REEL_POST_COUNT:-4}"

          if ! [[ "$IMAGE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "IMAGE_POST_COUNT must be a non-negative integer."
            exit 1
          fi

          if ! [[ "$REEL_COUNT" =~ ^[0-9]+$ ]]; then
            echo "REEL_POST_COUNT must be a non-negative integer."
            exit 1
          fi

          if [[ "${IMAGE_ENABLED,,}" != "true" ]]; then
            IMAGE_COUNT=0
          fi

          TOTAL_POSTS="$IMAGE_COUNT"
          if (( REEL_COUNT > TOTAL_POSTS )); then
            TOTAL_POSTS="$REEL_COUNT"
          fi

          echo "Image publishing enabled: $IMAGE_ENABLED"
          echo "Image posts: $IMAGE_COUNT"
          echo "Reel posts: $REEL_COUNT"
          echo "Total content items to generate: $TOTAL_POSTS"
          echo "Gemini image generation: ${USE_GEMINI_IMAGE:-false}"

          if (( TOTAL_POSTS == 0 )); then
            echo "Nothing is configured to publish. Exiting successfully."
            exit 0
          fi

          for POST_NUMBER in $(seq 1 "$TOTAL_POSTS"); do
            PUBLISH_IMAGE=false
            PUBLISH_REEL=false

            if (( POST_NUMBER <= IMAGE_COUNT )); then
              PUBLISH_IMAGE=true
            fi

            if (( POST_NUMBER <= REEL_COUNT )); then
              PUBLISH_REEL=true
            fi

            echo "========================================"
            echo "Generating content ${POST_NUMBER}/${TOTAL_POSTS}"
            echo "Image: ${PUBLISH_IMAGE} | Reel: ${PUBLISH_REEL}"
            echo "========================================"

            export CONTENT_COUNT="$TOTAL_POSTS"
            python app/generate.py

            FILE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              print(json.load(f)["filename"])
          PY
            )

            echo "Generated image: $FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Keep generated image + metadata in GitHub so the raw URL is
            # publicly reachable when an Instagram photo post is requested.
            git add -f \
              "generated/$FILE" \
              generated/latest.jpg \
              generated/latest.json \
              data/state.json \
              data/pending_posts.json

            git diff --cached --quiet || \
              git commit -m "chore: generate content ${POST_NUMBER}/${TOTAL_POSTS}"

            git push

            if [[ "$PUBLISH_IMAGE" == "true" ]]; then
              SHA=$(git rev-parse HEAD)
              IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/${FILE}"
              export IMAGE_URL

              python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["IMAGE_URL"]

          for attempt in range(12):
              try:
                  response = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=20,
                      headers={"User-Agent": "quote-automation/1.0"},
                  )
                  content_type = (
                      response.headers.get("Content-Type") or ""
                  ).lower()

                  print(
                      f"Attempt {attempt + 1}: "
                      f"HTTP {response.status_code}, "
                      f"Content-Type={content_type}"
                  )

                  if response.ok and (
                      content_type.startswith("image/jpeg")
                      or content_type.startswith("application/octet-stream")
                  ):
                      print("Image is publicly available.")
                      break

              except Exception as exc:
                  print(f"Attempt {attempt + 1} failed: {exc}")

              time.sleep(5)
          else:
              raise SystemExit(
                  "Generated image was not publicly available."
              )
          PY

              echo "Publishing photo..."
              python app/publish_instagram.py
            fi

            if [[ "$PUBLISH_REEL" == "true" ]]; then
              echo "Creating reel..."
              python app/create_reel.py

              REEL_FILE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              data = json.load(f)
              reel = data.get("reel_filename")
              if not reel:
                  raise SystemExit("reel_filename missing from latest.json")
              print(reel)
          PY
              )

              echo "Generated reel: $REEL_FILE"

              git add -f \
                "generated/$REEL_FILE" \
                generated/latest.json

              git diff --cached --quiet || \
                git commit -m "chore: generate reel ${POST_NUMBER}/${TOTAL_POSTS}"

              git push

              REEL_SHA=$(git rev-parse HEAD)
              REEL_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REEL_SHA}/generated/${REEL_FILE}"
              export REEL_URL

              python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["REEL_URL"]

          for attempt in range(12):
              try:
                  response = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=30,
                      headers={"User-Agent": "quote-automation/1.0"},
                  )

                  content_type = (
                      response.headers.get("Content-Type") or ""
                  ).lower()

                  print(
                      f"Reel attempt {attempt + 1}: "
                      f"HTTP {response.status_code}, "
                      f"Content-Type={content_type}"
                  )

                  if response.ok:
                      print("Reel video is publicly available.")
                      break

              except Exception as exc:
                  print(f"Reel attempt {attempt + 1} failed: {exc}")

              time.sleep(5)
          else:
              raise SystemExit(
                  "Generated reel was not publicly available."
              )
          PY

              echo "Publishing reel..."
              python app/publish_reel.py
            fi

            # Consume priority/fallback only after every requested publication
            # for this content item succeeds.
            SOURCE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              print(json.load(f).get("quote_source", ""))
          PY
            )

            if [[ "$SOURCE" == "priority" ]]; then
              if [[ -f app/consume_priority.py ]]; then
                python app/consume_priority.py
              fi

              if ! git diff --quiet -- priority.txt; then
                git add priority.txt
                git commit -m "chore: consume priority content"
                git push
              fi

            elif [[ "$SOURCE" == "fallback" ]]; then
              python app/consume_fallback.py

              if ! git diff --quiet -- data/fallback_quotes.txt; then
                git add data/fallback_quotes.txt
                git commit -m "chore: consume fallback quote"
                git push
              fi
            fi

            echo "Content ${POST_NUMBER}/${TOTAL_POSTS} completed."
          done

      - name: Send failure email
        if: failure()
        run: python app/notify_failure.py
