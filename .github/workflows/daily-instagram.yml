name: Daily Hindi Quote

on:
  schedule:
    - cron: "0 6,14,19 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-instagram-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

      META_API_VERSION: ${{ vars.META_API_VERSION }}

      HASHTAGS: ${{ vars.HASHTAGS }}
      AUTO_HASHTAGS: ${{ vars.AUTO_HASHTAGS }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required tools
        run: |
          python --version
          ffmpeg -version
          test -f app/create_reel.py
          test -f app/publish_reel.py

      - name: Publish 4 photo + reel posts
        shell: bash
        run: |
          set -euo pipefail

          for POST_NUMBER in 1 2 3 4; do
            echo "========================================"
            echo "Generating post ${POST_NUMBER}/4"
            echo "========================================"

            if [ "$POST_NUMBER" -eq 1 ]; then
              export FORCE_GEMINI=false
            else
              export FORCE_GEMINI=true
            fi

            # Generates one item from the prepared 4-post batch.
            # Gemini is used once per run; fallback_quotes.txt is used if Gemini fails.
            python app/generate.py

            FILE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              print(json.load(f)["filename"])
          PY
            )

            echo "Generated image: $FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f \
              "generated/$FILE" \
              generated/latest.jpg \
              generated/latest.json \
              data/state.json \
              data/pending_posts.json

            # Avoid failing when there is nothing new to commit.
            git diff --cached --quiet || \
              git commit -m "chore: generate post ${POST_NUMBER}/4"

            git push

            SHA=$(git rev-parse HEAD)
            IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/${FILE}"

            export IMAGE_URL

            python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["IMAGE_URL"]

          for attempt in range(12):
              try:
                  response = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=20,
                      headers={"User-Agent": "quote-automation/1.0"},
                  )

                  content_type = (
                      response.headers.get("Content-Type")
                      or ""
                  ).lower()

                  print(
                      f"Attempt {attempt + 1}: "
                      f"HTTP {response.status_code}, "
                      f"Content-Type={content_type}"
                  )

                  if (
                      response.ok
                      and content_type.startswith("image/jpeg")
                  ):
                      print("Image is publicly available.")
                      break

              except Exception as exc:
                  print(f"Attempt {attempt + 1} failed: {exc}")

              time.sleep(5)

          else:
              raise SystemExit(
                  "Generated image was not publicly available as JPEG."
              )
          PY

            echo "Publishing photo..."
            python app/publish_instagram.py

            echo "Creating reel..."
            python app/create_reel.py

            REEL_FILE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              data = json.load(f)
              reel = data.get("reel_filename")
              if not reel:
                  raise SystemExit("reel_filename missing from latest.json")
              print(reel)
          PY
            )

            echo "Generated reel: $REEL_FILE"

            git add -f \
              "generated/$REEL_FILE" \
              generated/latest.json

            git diff --cached --quiet || \
              git commit -m "chore: generate reel ${POST_NUMBER}/4"

            git push

            REEL_SHA=$(git rev-parse HEAD)
            REEL_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REEL_SHA}/generated/${REEL_FILE}"

            export REEL_URL

            python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["REEL_URL"]

          for attempt in range(12):
              try:
                  response = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=30,
                      headers={"User-Agent": "quote-automation/1.0"},
                  )

                  content_type = (
                      response.headers.get("Content-Type")
                      or ""
                  ).lower()

                  print(
                      f"Reel attempt {attempt + 1}: "
                      f"HTTP {response.status_code}, "
                      f"Content-Type={content_type}"
                  )

                  if (
                      response.ok
                      and content_type.startswith("video/mp4")
                  ):
                      print("Reel video is publicly available.")
                      break

              except Exception as exc:
                  print(
                      f"Reel attempt {attempt + 1} failed: {exc}"
                  )

              time.sleep(5)

          else:
              raise SystemExit(
                  "Generated reel was not publicly available as MP4."
              )
          PY

            echo "Publishing reel..."
            python app/publish_reel.py

            # Consume priority/fallback only after BOTH photo and reel succeed.
            SOURCE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              print(json.load(f).get("quote_source", ""))
          PY
            )

            if [ "$SOURCE" = "priority" ]; then
              if [ -f app/consume_priority.py ]; then
                python app/consume_priority.py || true
              fi

              if ! git diff --quiet -- priority.txt; then
                git add priority.txt
                git commit -m "chore: consume priority content"
                git push
              fi

            elif [ "$SOURCE" = "fallback" ]; then
              python app/consume_fallback.py

              if ! git diff --quiet -- data/fallback_quotes.txt; then
                git add data/fallback_quotes.txt
                git commit -m "chore: consume fallback quote"
                git push
              fi
            fi

            echo "Post + reel ${POST_NUMBER}/4 published successfully."
          done

      - name: Send failure email
        if: failure()
        run: python app/notify_failure.py
