name: Daily Hindi Quote

on:
  schedule:
    - cron: "0 14 * * *" # 19:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      # Existing GitHub secret names
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

      # Optional; publish_instagram.py falls back to v25.0
      META_API_VERSION: ${{ vars.META_API_VERSION }}

      HASHTAGS: ${{ vars.HASHTAGS }}
      AUTO_HASHTAGS: ${{ vars.AUTO_HASHTAGS }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check priority queue
        id: priority
        shell: bash
        run: |
          HAS_PRIORITY=$(python - <<'PY'
          from app.quote_source import get_priority_quote
          quote, _ = get_priority_quote()
          print("true" if quote else "false")
          PY
          )
          echo "has_priority=$HAS_PRIORITY" >> "$GITHUB_OUTPUT"
          echo "Priority available: $HAS_PRIORITY"

      - name: Generate first image
        run: python app/generate.py

      - name: Commit first generated image and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ data/state.json
          git commit -m "chore: generate daily quote"
          git push

      - name: Verify stable image exists on GitHub
        id: image1
        shell: bash
        run: |
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/generated/latest.jpg" >> "$GITHUB_OUTPUT"
          echo "Using image URL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/generated/latest.jpg"

      - name: Wait for GitHub raw image availability
        env:
          IMAGE_URL: ${{ steps.image1.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["IMAGE_URL"]

          for attempt in range(12):
              try:
                  r = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=20,
                      headers={"User-Agent": "quote-automation/1.0"},
                  )
                  ct = (r.headers.get("Content-Type") or "").lower()
                  print(f"Attempt {attempt + 1}: HTTP {r.status_code}, Content-Type={ct}, URL={r.url}")

                  if r.ok and ct.startswith("image/"):
                      print("Stable image URL is ready.")
                      break
              except Exception as exc:
                  print(f"Attempt {attempt + 1} failed: {exc}")

              time.sleep(5)
          else:
              raise SystemExit("GitHub raw image was not available after waiting.")
          PY

      - name: Publish first Instagram post
        env:
          IMAGE_URL: ${{ steps.image1.outputs.url }}
        run: python app/publish_instagram.py

      - name: Commit consumed priority item
        if: steps.priority.outputs.has_priority == 'true'
        run: |
          if git diff --quiet -- priority.txt; then
            echo "No priority.txt change detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add priority.txt
            git commit -m "chore: consume priority quote"
            git push
          fi

      - name: Generate second Gemini image
        if: steps.priority.outputs.has_priority == 'true'
        run: python app/generate.py

      - name: Commit second generated image and state
        if: steps.priority.outputs.has_priority == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@noreply.github.com"
          git add generated/ data/state.json
          git commit -m "chore: generate second Gemini quote"
          git push

      - name: Set second image URL
        id: image2
        if: steps.priority.outputs.has_priority == 'true'
        shell: bash
        run: |
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/generated/latest.jpg" >> "$GITHUB_OUTPUT"

      - name: Wait for second GitHub raw image
        if: steps.priority.outputs.has_priority == 'true'
        env:
          IMAGE_URL: ${{ steps.image2.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["IMAGE_URL"]

          for attempt in range(12):
              try:
                  r = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=20,
                      headers={"User-Agent": "quote-automation/1.0"},
                  )
                  ct = (r.headers.get("Content-Type") or "").lower()
                  print(f"Attempt {attempt + 1}: HTTP {r.status_code}, Content-Type={ct}, URL={r.url}")

                  if r.ok and ct.startswith("image/"):
                      print("Second stable image URL is ready.")
                      break
              except Exception as exc:
                  print(f"Attempt {attempt + 1} failed: {exc}")

              time.sleep(5)
          else:
              raise SystemExit("Second GitHub raw image was not available after waiting.")
          PY

      - name: Publish second Instagram post
        if: steps.priority.outputs.has_priority == 'true'
        env:
          IMAGE_URL: ${{ steps.image2.outputs.url }}
        run: python app/publish_instagram.py

      - name: Send failure email
        if: failure()
        run: python app/notify_failure.py
