name: Daily Hindi Quote

on:
  schedule:
    # GitHub Actions supports timezone-aware schedules.
    # All three times are India time (Asia/Kolkata).
    - cron: "0 6,14,19 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-instagram-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

      META_API_VERSION: ${{ vars.META_API_VERSION }}

      HASHTAGS: ${{ vars.HASHTAGS }}
      AUTO_HASHTAGS: ${{ vars.AUTO_HASHTAGS }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check priority queue
        id: priority
        shell: bash
        run: |
          HAS_PRIORITY=$(python - <<'PY'
          from app.quote_source import get_priority_quote
          quote, _ = get_priority_quote()
          print("true" if quote else "false")
          PY
          )

          echo "has_priority=$HAS_PRIORITY" >> "$GITHUB_OUTPUT"
          echo "Priority available: $HAS_PRIORITY"

      - name: Publish 4 unique posts
        shell: bash
        run: |
          set -euo pipefail

          for POST_NUMBER in 1 2 3 4; do

            echo "========================================"
            echo "Generating post ${POST_NUMBER}/4"
            echo "========================================"

            if [ "$POST_NUMBER" -eq 1 ]; then
              export FORCE_GEMINI=false

              if [ "${{ steps.priority.outputs.has_priority }}" = "true" ]; then
                echo "Post 1 source: PRIORITY"
              else
                echo "Post 1 source: GEMINI"
              fi
            else
              export FORCE_GEMINI=true
              echo "Post ${POST_NUMBER} source: GEMINI"
            fi

            # Generate one new image + one new quote.
            python app/generate.py

            FILE=$(python - <<'PY'
          import json
          with open("generated/latest.json", encoding="utf-8") as f:
              print(json.load(f)["filename"])
          PY
            )

            echo "Generated file: $FILE"

            # Only add the files needed for this post.
            # -f is required because generated JPGs may be gitignored.
            git add -f \
              "generated/$FILE" \
              generated/latest.jpg \
              generated/latest.json \
              data/state.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "chore: generate post ${POST_NUMBER}/4"
            git push

            SHA=$(git rev-parse HEAD)

            IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/${FILE}"

            echo "Public image URL:"
            echo "$IMAGE_URL"

            echo "Waiting for GitHub raw image..."

            export IMAGE_URL

            python - <<'PY'
          import os
          import time
          import requests

          url = os.environ["IMAGE_URL"]

          for attempt in range(12):
              try:
                  response = requests.get(
                      url,
                      stream=True,
                      allow_redirects=True,
                      timeout=20,
                      headers={
                          "User-Agent": "quote-automation/1.0"
                      },
                  )

                  content_type = (
                      response.headers.get("Content-Type")
                      or ""
                  ).lower()

                  print(
                      f"Attempt {attempt + 1}: "
                      f"HTTP {response.status_code}, "
                      f"Content-Type={content_type}"
                  )

                  if (
                      response.ok
                      and content_type.startswith("image/jpeg")
                  ):
                      print("Image is publicly available.")
                      break

              except Exception as exc:
                  print(
                      f"Attempt {attempt + 1} failed: {exc}"
                  )

              time.sleep(5)

          else:
              raise SystemExit(
                  "Generated image was not publicly available "
                  "as JPEG after waiting."
              )
          PY

            echo "Publishing post ${POST_NUMBER}/4..."

            python app/publish_instagram.py

            # publish_instagram.py removes the priority line only after
            # Instagram confirms publication.
            if git diff --quiet -- priority.txt; then
              echo "No priority.txt change for post ${POST_NUMBER}."
            else
              git add priority.txt
              git commit -m "chore: consume priority content"
              git push
            fi

            echo "Post ${POST_NUMBER}/4 published successfully."

          done

      - name: Send failure email
        if: failure()
        run: python app/notify_failure.py
